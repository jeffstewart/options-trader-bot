# Local stand-in for the eventual Fly.io/systemd deploy (docs/HANDOFF.md's go-live plan):
# a single always-on container, auto-restarted by the platform, with data/logs bind-mounted so
# the host-side dashboard.py (NOT containerized -- run it separately with the venv, same as
# today) keeps working against the exact same files.
#
# Usage:
#   docker compose up -d --build      # build + start, detached
#   docker compose logs -f            # follow logs (also written to ./logs/bot.log)
#   docker compose down               # SIGTERM -> graceful shutdown -> stop
services:
  v2-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ollama runs on the HOST, not in this container -- "localhost" inside the container means
      # the container itself, not the Mac. host.docker.internal is Docker Desktop's (Mac/Windows)
      # built-in name for the host; extra_hosts below adds the same mapping on Linux.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - TRADER_DATA_DIR=/app/data
      - TRADER_LOG_DIR=/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ── DNS (added 2026-07-30) ────────────────────────────────────────────────────────────────
    # By default the container inherits the HOST's resolver chain via Docker's embedded DNS.
    # On this Mac that chain is fragile: `scutil --dns` shows a local resolver at 127.0.0.1 plus
    # routers on TWO different subnets (192.168.1.1 and 192.168.68.1), i.e. a local DNS proxy in
    # front of a multi-network setup. When any of that flaps, every container lookup fails at
    # once -- which is exactly the observed signature: short bursts of "Temporary failure in name
    # resolution" hitting www.sec.gov, data.alpaca.markets and anything else in flight, clustered
    # around 11:00-12:00 UTC (04-05 PDT) on 07-24, 07-29 and 07-30.
    # Pointing the container at public resolvers removes the dependency on that host-side chain.
    # host.docker.internal still resolves because extra_hosts writes it to /etc/hosts, which is
    # consulted before DNS (verified: 192.168.5.2) -- so the host-Ollama ticker corrector is
    # unaffected.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # More attempts with a shorter timeout: glibc defaults to timeout:5 attempts:2, so a single
    # blip surfaces as an application error after 10s. 3 attempts at 2s rides out a brief flap
    # inside one getaddrinfo() call instead of bubbling up.
    dns_opt:
      - timeout:2
      - attempts:3
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
